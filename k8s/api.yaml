apiVersion: v1
kind: Service
metadata:
  name: job-search-api
  labels: { app: job-search-api }
spec:
  selector: { app: job-search-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-search-api
spec:
  replicas: 3
  selector: { matchLabels: { app: job-search-api } }
  template:
    metadata: { labels: { app: job-search-api } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: registry.example.com/job-search-api:1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: job-search-api-secrets } }]
          readinessProbe:
            {
              httpGet: { path: /readyz, port: http },
              initialDelaySeconds: 5,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /healthz, port: http },
              initialDelaySeconds: 10,
              periodSeconds: 15,
            }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: job-search-api }
spec:
  scaleTargetRef:
    { apiVersion: apps/v1, kind: Deployment, name: job-search-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    [
      {
        type: Resource,
        resource:
          { name: cpu, target: { type: Utilization, averageUtilization: 70 } },
      },
    ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: job-search-api }
spec:
  podSelector: { matchLabels: { app: job-search-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    [
      {
        from: [{ namespaceSelector: {} }],
        ports: [{ protocol: TCP, port: 8080 }],
      },
    ]
  egress:
    [
      {
        to: [{ namespaceSelector: {} }],
        ports:
          [
            { protocol: TCP, port: 5432 },
            { protocol: TCP, port: 6379 },
            { protocol: TCP, port: 443 },
          ],
      },
    ]
